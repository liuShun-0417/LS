spring:
  application:
    name: demo
  config:
    import: optional:file:./application-local.yaml
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:demo}?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai&connectTimeout=5000&socketTimeout=10000
    username: ${DB_USERNAME:stu}
    password: ${DB_PASSWORD:}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
server:
  port: 8080
sa-token:
  token-name: satoken
  timeout: 86400
  is-share: false
  is-read-cookie: false
  is-read-header: true
  is-read-body: false
  is-read-param: false

ai:
  base-url: ${AI_BASE_URL:}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gpt-5.6-luna}
  max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:8192}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:180}

redisson:
  address: ${REDIS_ADDRESS:redis://127.0.0.1:6379}
  password: ${REDIS_PASSWORD:}
  database: ${REDIS_DATABASE:0}
